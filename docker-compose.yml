version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: skoob_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: skoob_clone
      MYSQL_USER: skoob_user
      MYSQL_PASSWORD: skoob_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
